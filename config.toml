[project_context]
default_commit_count = 5
timeout_seconds = 2.0

[session_logging]
session_prefix = "session"
enabled = true

[tools.skill]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.web_search]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = []
timeout = 120
model = "mistral-vibe-cli-fast"

[tools.write_file]
permission = "ask"
allowlist = [
    "/tmp/*",
]
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_write_bytes = 64000
create_parent_dirs = true

[tools.todo]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []
max_todos = 100

[tools.task]
permission = "always"
allowlist = [
    "code-reviewer",
    "lisp-implementor",
    "finder",
    "explorer",
    "generic-implementor",
    "researcher",
    "summarizer",
    "advisor",
    "verifier",
    "worker",
    "luna-worker",
]
denylist = []
sensitive_patterns = []

[tools.exit_plan_mode]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.ask_user_question]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = []

[tools.web_fetch]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = []
default_timeout = 30
max_timeout = 120
max_content_bytes = 120000
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

[tools.bash]
permission = "ask"
allowlist = [
    "find",
]
denylist = [
    "git push",
    "git reset --hard",
    "git clean",
    "git checkout",
    "git stash drop",
    "rm -rf",
    "sudo",
    "gdb",
    "pdb",
    "passwd",
    "nano",
    "vim",
    "vi",
    "emacs",
    "bash -i",
    "sh -i",
    "zsh -i",
    "fish -i",
    "dash -i",
    "screen",
    "tmux",
]
sensitive_patterns = [
    "sudo",
]
max_output_bytes = 16000
default_timeout = 300
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]

[tools.grep]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
max_output_bytes = 64000
default_max_matches = 100
default_timeout = 60
exclude_patterns = [
    ".venv/",
    "venv/",
    ".env/",
    "env/",
    "node_modules/",
    ".git/",
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".tox/",
    ".nox/",
    ".coverage/",
    "htmlcov/",
    "dist/",
    "build/",
    ".idea/",
    ".vscode/",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    ".DS_Store",
    "Thumbs.db",
]
codeignore_file = ".vibeignore"

[tools.edit]
permission = "ask"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
fuzzy_threshold = 0.98

[tools.read_file]
permission = "always"
allowlist = []
denylist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]
