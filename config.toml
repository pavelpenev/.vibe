api_style = "openai"
backend = "mistral"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[providers.extra_headers]

[[providers]]
name = "codex"
api_base = "http://127.0.0.1:18080/v1"
api_key_env_var = ""
api_style = "openai-responses"
backend = "generic"

[[models]]
