agent_type = "subagent"
display_name = "Context Restorer"
description = "Reorient main agent after compaction by reading relevant files and restoring project context"
safety = "safe"
active_model = "small-model"
system_prompt_id = "context-restorer"
enabled_tools = ["read_file", "grep", "bash"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
  "cd",
  "echo",
  "ls",
  "find",
  "cat",
  "head -n",
  "tail -n",
  "wc -l",
  "grep",
  "pwd",
  "test -f",
  "git status",
  "git diff",
  "git log",
  "git branch"
]
