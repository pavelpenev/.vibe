agent_type = "subagent"
display_name = "Explorer"
description = "Systematically explore project structure, read key files including AGENTS.md for project context"
safety = "safe"
active_model = "gpt-5.6-luna"
bypass_tool_permissions = false
system_prompt_id = "explorer"
enabled_tools = ["read_file", "bash", "grep"]

[tools.read_file]
permission = "always"

[tools.bash]
permission = "always"
allowlist = []
denylist = [
    "git push",
    "git reset --hard",
    "git clean",
    "git checkout",
    "git stash drop",
    "rm -rf",
    "sudo",
]
sensitive_patterns = [
    "sudo",
]
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]

[tools.grep]
permission = "always"
