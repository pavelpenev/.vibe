agent_type = "subagent"
display_name = "Explorer"
description = "Systematically explore project structure, read key files including AGENTS.md for project context"
safety = "safe"
active_model = "small-model"
system_prompt_id = "explorer"
enabled_tools = ["read_file", "bash", "grep"]

[tools.read_file]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
  "cd",
  "echo",
  "ls",
  "find",
  "cat",
  "head -n",
  "tail -n",
  "wc -l",
  "grep",
  "pwd",
  "test -f"
]

[tools.grep]
permission = "always"
