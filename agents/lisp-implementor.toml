agent_type = "subagent"
display_name = "Lisp Implementor"
description = "Intent-based Lisp file editing using form-based extraction for s-expression safety. Reads the file, decides the edit, validates parenthesis balance before and after."
safety = "neutral"
active_model = "worker"
bypass_tool_permissions = false
system_prompt_id = "lisp-implementor"
enabled_tools = ["read_file", "write_file", "grep", "bash"]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "always"
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]

[tools.grep]
permission = "always"

[tools.bash]
permission = "always"
allowlist = []
denylist = [
    "git push",
    "git reset --hard",
    "git clean",
    "git checkout",
    "git stash drop",
    "rm -rf",
    "sudo",
]
sensitive_patterns = [
    "sudo",
]
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]
