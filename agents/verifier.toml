agent_type = "subagent"
display_name = "Verifier"
description = "Run project verification commands from AGENTS.md and return structured pass/fail results"
safety = "safe"
active_model = "gpt-5.6-luna"
bypass_tool_permissions = false
system_prompt_id = "verifier"
enabled_tools = ["bash", "read_file", "grep"]

[tools.bash]
permission = "always"
allowlist = []
denylist = [
    "git push",
    "git reset --hard",
    "git clean",
    "git checkout",
    "git stash drop",
    "rm -rf",
    "sudo",
]
sensitive_patterns = [
    "sudo",
]
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"
