agent_type = "subagent"
display_name = "Reviewer (Deepseek)"
description = "Independent artifact reviewer on deepseek-v4-flash; read-only review of code, docs, specs, plans"
safety = "safe"
active_model = "worker"
bypass_tool_permissions = false
system_prompt_id = "reviewer"
enabled_tools = ["read_file", "grep", "bash"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "always"
allowlist = []
denylist = [
    "git push",
    "git reset --hard",
    "git clean",
    "git checkout",
    "git stash drop",
    "rm -rf",
    "sudo",
]
sensitive_patterns = [
    "sudo",
]
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]
