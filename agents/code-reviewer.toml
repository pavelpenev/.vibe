agent_type = "subagent"
display_name = "Code Reviewer"
description = "Reviews code for quality, security, and best practices"
safety = "safe"
system_prompt_id = "code-reviewer"
enabled_tools = ["read_file", "grep", "bash"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
  "cd",
  "echo",
  "ls",
  "find",
  "cat",
  "head",
  "tail",
  "wc",
  "grep",
  "pwd",
  "test -f",
  "sed",
  "sort",
  "uniq",
  "cut",
  "awk",
  "comm",
  "tr",
  "xargs",
  "basename",
  "dirname",
  "stat",
  "which",
  "nl",
  "od",
  "tree",
  "timeout",
  "curl",
  "python3",
  "python",
  "sblint",
  "ros",
  "./test/run-tests.sh",
  "bash test/run-tests.sh",
  "cp",
  "read",
  "git log",
  "git diff",
  "git diff --staged",
  "git show",
  "git blame",
  "git status",
  "git branch",
  "git remote -v",
  "git ls-remote",
  "git ls-files",
  "git grep",
  "git check-ignore"
]
