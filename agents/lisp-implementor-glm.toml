agent_type = "subagent"
display_name = "Lisp Implementor (Glm)"
description = "Lisp implementor on glm-5-2; intent-based Lisp editing with form extraction for s-expression safety"
safety = "neutral"
active_model = "orchestrator"
bypass_tool_permissions = false
system_prompt_id = "lisp-implementor"
enabled_tools = ["read_file", "write_file", "grep", "bash"]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "always"
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]

[tools.grep]
permission = "always"

[tools.bash]
permission = "always"
allowlist = []
denylist = [
    "git push",
    "git reset --hard",
    "git clean",
    "git checkout",
    "git stash drop",
    "rm -rf",
    "sudo",
]
sensitive_patterns = [
    "sudo",
]
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]
