agent_type = "subagent"
display_name = "Generic Subagent (Luna)"
description = "Generic subagent on GPT-5.6-luna; loads role skills (implementor, reviewer, advisor, etc.) to perform any delegated role"
safety = "neutral"
active_model = "gpt-5.6-luna"
bypass_tool_permissions = false
system_prompt_id = "generic-subagent"
enabled_tools = ["read_file", "write_file", "edit", "grep", "bash", "skill", "web_search", "web_fetch"]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "always"
allowlist = []
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]

[tools.edit]
permission = "always"
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
]

[tools.grep]
permission = "always"

[tools.bash]
permission = "always"
allowlist = []
denylist = [
    "git push",
    "git reset --hard",
    "git clean",
    "git checkout",
    "git stash drop",
    "rm -rf",
    "sudo",
]
sensitive_patterns = [
    "sudo",
]
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]

[tools.skill]
permission = "always"

[tools.web_search]
permission = "always"

[tools.web_fetch]
permission = "always"
