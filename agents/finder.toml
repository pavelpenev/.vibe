agent_type = "subagent"
display_name = "Finder"
description = "Search for patterns across files using grep/find commands"
safety = "safe"
active_model = "small-model"
system_prompt_id = "finder"
enabled_tools = ["grep", "bash"]

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
  "cd",
  "echo",
  "ls",
  "find",
  "cat",
  "head",
  "tail",
  "wc",
  "grep",
  "pwd",
  "test -f",
  "rg",
  "ag",
  "sed",
  "sort",
  "uniq",
  "cut",
  "awk",
  "comm",
  "tr",
  "xargs",
  "basename",
  "dirname",
  "stat",
  "which",
  "nl",
  "od",
  "read",
  "printf",
  "date",
  "jq",
  "python3"
]
