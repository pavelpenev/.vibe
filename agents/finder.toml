agent_type = "subagent"
display_name = "Finder"
description = "Search for patterns across files using grep/find commands"
safety = "safe"
active_model = "worker"
bypass_tool_permissions = false
system_prompt_id = "finder"
enabled_tools = ["grep", "bash"]

[tools.grep]
permission = "always"

[tools.bash]
permission = "always"
allowlist = []
denylist = [
    "git push",
    "git reset --hard",
    "git clean",
    "git checkout",
    "git stash drop",
    "rm -rf",
    "sudo",
]
sensitive_patterns = [
    "sudo",
]
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]
