agent_type = "subagent"
display_name = "Finder"
description = "Search for patterns across files using grep/find commands"
safety = "safe"
active_model = "small-model"
system_prompt_id = "finder"
enabled_tools = ["grep", "bash"]

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"
allowlist = [
  "cd",
  "echo",
  "ls",
  "find",
  "cat",
  "head -n",
  "tail -n",
  "wc -l",
  "grep",
  "pwd",
  "test -f",
  "rg",
  "ag"
]
